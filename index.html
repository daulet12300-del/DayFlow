<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14172B">
<meta name="description" content="DayFlow: личный органайзер. Задачи, привычки и заметки, неделя в одном месте.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DayFlow">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DayFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column floating over a soft night sky. Scrolling content, docked quick-add bar, five-tab bar. */
:root{
  --bg:#14172B; --card:#1E2242; --raise:#383C70; --green:#B6ADF3; --green-deep:#E6B8F2; --green-soft:#2B2F5E;
  --ink:#ECEAFB; --muted:#A6AACF; --faint:#6F74A4; --sand:#F3D5A5; --sand-soft:#383450;
  --terra:#F4A3AB; --terra-soft:#43304A; --line:rgba(255,255,255,.09); --on-green:#1B1840; --on-accent:#1B1840;
  --shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 8px 22px rgba(6,7,22,.35);
  --f-display:'Geologica','Onest',system-ui,-apple-system,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
.space{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(55% 38% at 95% -2%,rgba(182,173,243,.20),transparent 70%),
             radial-gradient(48% 34% at -4% 102%,rgba(240,168,192,.14),transparent 70%),
             radial-gradient(40% 26% at 4% 28%,rgba(143,191,239,.07),transparent 70%)}
.stars{position:absolute;inset:0;background-size:300px 300px;opacity:.55;
  background-image:radial-gradient(1px 1px at 20px 30px,rgba(255,255,255,.75),transparent),radial-gradient(1px 1px at 120px 80px,rgba(255,255,255,.5),transparent),radial-gradient(1.5px 1.5px at 220px 140px,rgba(255,255,255,.65),transparent),radial-gradient(1px 1px at 70px 200px,rgba(255,255,255,.45),transparent),radial-gradient(1px 1px at 260px 250px,rgba(255,255,255,.55),transparent),radial-gradient(1.5px 1.5px at 170px 270px,rgba(243,213,165,.7),transparent)}
.stars.b{background-size:430px 430px;opacity:.5;animation:twinkle 7s ease-in-out infinite alternate;
  background-image:radial-gradient(1.2px 1.2px at 60px 90px,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 200px 40px,rgba(230,184,242,.8),transparent),radial-gradient(1.4px 1.4px at 330px 190px,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 140px 330px,rgba(182,173,243,.8),transparent),radial-gradient(1px 1px at 390px 380px,rgba(255,255,255,.6),transparent)}
@keyframes twinkle{from{opacity:.15}to{opacity:.7}}
@media (prefers-reduced-motion:reduce){.stars.b{animation:none;opacity:.4}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.4 var(--f-body);-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
svg{display:block;flex:none}
h1,h2,h3,p{margin:0}
#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;background:transparent;padding-top:env(safe-area-inset-top);position:relative;z-index:1}
#scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 16px 28px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){#scroll{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* type */
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.title{font:500 1.75rem/1.15 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.subtitle{color:var(--muted);margin-top:4px;font-size:.95rem}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 14px}
.top .btns{display:flex;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:background .15s}
.iconbtn:hover,.iconbtn:active{background:var(--green-soft);color:var(--green)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 8px}
.sec h2{font:500 1.05rem/1.2 var(--f-display)}
.sec span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.small{font-size:.85rem;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;background:var(--green);color:var(--on-green);font-weight:500;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn{text-align:center;line-height:1.2}
.btn.ghost{background:var(--green-soft);color:var(--green)}
.btn:not(.ghost):not(.line):not(.danger){background:linear-gradient(135deg,#B6ADF3,#D3B4F2)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--terra-soft);color:var(--terra)}
.btn.sm{min-height:34px;padding:0 12px;border-radius:10px;font-size:.88rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* chips & segmented */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 11px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:.82rem;font-weight:500;white-space:nowrap}
.chip.sel{background:var(--green);color:var(--on-green)}
.chip.plain{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.chip.plain.sel{background:var(--green);color:var(--on-green);box-shadow:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--green));flex:none}
.seg{display:flex;background:var(--green-soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:34px;border-radius:10px;font-size:.88rem;font-weight:500;text-align:center;color:var(--muted)}
.seg button.sel{background:var(--raise);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* banners */
.banner{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;margin-top:12px;background:var(--sand-soft);color:var(--ink)}
.banner b{font-weight:500}
.banner .go{margin-left:auto;color:var(--green);font-weight:500;font-size:.88rem;white-space:nowrap}
.banner.terra{background:var(--terra-soft)}
.banner.terra .go,.banner.terra svg{color:var(--terra)}
.banner.green{background:var(--green-soft)}

/* progress card */
.prog{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bg{stroke:var(--green-soft)}
.ring .fg{stroke:url(#rg);transition:stroke-dasharray .5s ease;filter:drop-shadow(0 0 5px rgba(182,173,243,.55))}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:500 1.15rem var(--f-display)}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}
.pstats div{display:flex;flex-direction:column}
.pstats b{font:500 1.5rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.pstats span{font-size:.75rem;color:var(--muted);margin-top:2px}

/* task rows */
.list{display:flex;flex-direction:column;gap:8px}
.swipe{position:relative;border-radius:16px;overflow:hidden;background:var(--green-soft)}
.swipe.dragging{z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:visible}
.swipe.dropbefore::before{content:"";position:absolute;left:8px;right:8px;top:-5px;height:3px;border-radius:3px;background:var(--green)}
.swbg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:.85rem;font-weight:500;opacity:0}
.swbg span{display:flex;align-items:center;gap:6px}
.swipe[data-dir="r"] .swbg{opacity:var(--p,0);color:var(--green)}
.swipe[data-dir="r"] .swr{visibility:hidden}
.swipe[data-dir="l"] .swbg{opacity:var(--p,0);color:var(--terra);background:var(--sand-soft)}
.swipe[data-dir="l"] .swl{visibility:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;background:var(--card);box-shadow:var(--shadow);border-radius:16px;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;min-height:60px}
.swipe:not(.swiping) .row{transition:transform .2s ease}
.row .chk{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--faint);display:grid;place-items:center;color:transparent;flex:none;transition:background .15s,border-color .15s,transform .15s}
.row .chk.on{background:var(--green);border-color:var(--green);color:var(--on-green);animation:pop .25s ease}
@keyframes pop{50%{transform:scale(1.18)}}
.row.p2 .chk:not(.on){border-color:var(--green-deep)}
.rbody{flex:1;min-width:0;cursor:pointer}
.rtitle{font-weight:500;overflow-wrap:anywhere}
.row.done .rtitle{text-decoration:line-through;color:var(--muted);font-weight:400}
.row.done{opacity:.78}
.rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:3px;font-size:.78rem;color:var(--muted)}
.rmeta>*{display:inline-flex;align-items:center;gap:4px}
.rmeta .tm{color:var(--green);font-weight:500;font-variant-numeric:tabular-nums}
.rmeta .late{color:var(--terra);font-weight:500}
.star{width:34px;height:34px;display:grid;place-items:center;color:var(--faint);border-radius:10px;flex:none}
.star.on{color:var(--sand)}
.star.on svg{fill:currentColor}
.grip{width:28px;height:40px;display:grid;place-items:center;color:var(--faint);touch-action:none;cursor:grab;flex:none}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:.92rem;border:1px dashed var(--line);border-radius:16px}

/* habits on today */
.hrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.hic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--hc,var(--green)) 16%,transparent);color:var(--hc,var(--green));flex:none}
.hrow .hn{flex:1;min-width:0;font-weight:500}
.hcheck{width:34px;height:34px;border-radius:50%;border:1.8px solid var(--faint);display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.hcheck.on{background:var(--hc,var(--green));border-color:var(--hc,var(--green));color:var(--on-accent)}

/* habit cards */
.hcard{margin-bottom:12px}
.hhead{display:flex;align-items:center;gap:12px}
.hname{flex:1;min-width:0;cursor:pointer}
.hname b{display:block;font-weight:500}
.hname span{font-size:.8rem;color:var(--muted)}
.hstreak{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--sand);font-weight:500;white-space:nowrap}
.hstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.hd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;background:var(--bg);font-size:.7rem;color:var(--muted)}
.hd b{font-weight:500;font-size:.85rem;color:var(--ink);font-variant-numeric:tabular-nums}
.hd.on{background:var(--hc,var(--green));color:var(--on-accent)}
.hd.on b{color:var(--on-accent)}
.hd.fut{opacity:.4;pointer-events:none}
.hd.off{opacity:.55}
.hd.t{box-shadow:inset 0 0 0 1.5px var(--hc,var(--green))}
.hfoot{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.8rem;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:6px;background:var(--green-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--hc,var(--green));transition:width .4s}

/* week */
.strip{position:sticky;top:0;z-index:4;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 -16px;padding:8px 16px 10px;background:rgba(20,23,43,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:.7rem;color:var(--muted)}
.sd b{font:500 1rem var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.sd i{display:block;width:18px;height:3px;border-radius:3px;background:var(--green-soft);overflow:hidden;margin-top:2px}
.sd i u{display:block;height:100%;background:var(--green);text-decoration:none}
.sd.t{background:var(--green);color:var(--on-green)}
.sd.t b{color:var(--on-green)}
.sd.t i{background:rgba(27,24,64,.28)}
.sd.t i u{background:var(--on-green)}
.day{margin-top:14px;scroll-margin-top:92px}
.dayh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.dayh h3{font:500 1.05rem var(--f-display)}
.dayh h3 small{font:400 .85rem var(--f-body);color:var(--muted);margin-left:6px}
.day.today .dayh h3::after{content:"сегодня";margin-left:8px;font:500 .68rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--green);background:var(--green-soft);padding:3px 8px;border-radius:999px;vertical-align:middle}
.dprog{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.inl{display:flex;gap:6px;margin-top:8px}
.inl input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px dashed var(--faint);background:transparent;padding:0 12px}
.inl input:focus{border-style:solid;border-color:var(--green);outline:none;background:var(--card)}
.inl button{width:42px;height:42px;border-radius:12px;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.wsum{display:flex;flex-direction:column;gap:12px}
.wsum .bar{height:8px}
.wgrid{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,30px);gap:6px 4px;align-items:center}
.wgrid .hn{font-size:.88rem;font-weight:500;display:flex;align-items:center;gap:8px;min-width:0}
.wgrid .hn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wgrid .h{font-size:.68rem;color:var(--muted);text-align:center}
.wgrid button.c{width:28px;height:28px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:transparent}
.wgrid button.c.on{background:var(--hc);color:var(--on-accent)}
.wgrid button.c.fut{opacity:.35;pointer-events:none}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mh{font-size:.7rem;color:var(--muted);text-align:center;padding:4px 0}
.mc{min-height:56px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:5px}
.mc.out{opacity:.4}
.mc b{font-weight:500;font-size:.88rem;font-variant-numeric:tabular-nums;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.mc.t b{background:var(--green);color:var(--on-green)}
.mc .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:7px}
.mc .dots i{width:6px;height:6px;border-radius:50%;background:var(--sand)}
.mc .dots i.d{background:var(--green)}
.mc .dots i.l{background:var(--terra)}
.mc .dots i.h{background:var(--green-deep);outline:1.5px solid var(--sand);outline-offset:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--sand)}
.legend i.d{background:var(--green)}.legend i.l{background:var(--terra)}.legend i.h{background:var(--green-deep);outline:1.5px solid var(--sand)}
.navrow{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.navrow .lbl{flex:1;text-align:center;font:500 1rem var(--f-display)}

/* tasks tab */
.search{display:flex;align-items:center;gap:8px;padding:0 12px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:none;min-width:0;height:100%}
.smartgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.smart{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);min-height:92px}
.smart .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.smart.warn .ico{background:var(--terra-soft);color:var(--terra)}
.smart .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:500;font-size:.95rem}
.smart .nm span{flex:none;color:var(--muted);font:500 1.05rem var(--f-display);font-variant-numeric:tabular-nums}
.catrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.catrow b{flex:1;font-weight:500}
.catrow span{color:var(--muted);font-variant-numeric:tabular-nums}

/* notes */
.ncard{display:block;width:100%;padding:14px 16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);margin-bottom:10px}
.ncard .nt{display:flex;align-items:center;gap:8px;font-weight:500}
.ncard .nt .ico{color:var(--sand)}
.ncard p{color:var(--muted);font-size:.88rem;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.ncard .nf{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:.75rem;color:var(--muted)}
.tag{padding:2px 8px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:.7rem;font-weight:500}
.tag.sand{background:var(--sand-soft);color:var(--sand)}

/* docked quick add */
#qa{padding:8px 16px 8px;background:linear-gradient(to top,rgba(20,23,43,.92) 65%,rgba(20,23,43,0))}
#qachips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;min-height:0}
#qachips .chip{min-height:26px;font-size:.76rem}
#qaform{display:flex;gap:8px;align-items:center}
#qainput{flex:1;min-width:0;height:48px;border-radius:16px;border:0;padding:0 16px;background:var(--card);box-shadow:var(--shadow),inset 0 0 0 1px var(--line)}
#qainput:focus{outline:2px solid var(--green);outline-offset:0}
#qaform .btn{width:48px;min-height:48px;padding:0;border-radius:16px}
#qamore{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}

/* tab bar */
#tabs{display:grid;grid-template-columns:repeat(5,1fr);background:rgba(24,27,52,.94);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:14px;font-size:.7rem;font-weight:500;color:var(--muted);position:relative;text-align:center}
#tabs button.on{color:var(--green)}
#tabs button.on .ti{background:var(--green-soft)}
#tabs .ti{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
#tabs .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--terra);color:var(--on-accent);font-size:.62rem;display:grid;place-items:center;padding:0 4px}

/* sheets */
#sheets{position:fixed;inset:0;z-index:50;pointer-events:none}
.sheetwrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(7,8,24,.62);animation:fade .2s ease both}
.sheet{position:relative;width:100%;max-width:540px;max-height:92%;display:flex;flex-direction:column;background:#181B36;box-shadow:0 -10px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);border-radius:24px 24px 0 0;animation:up .24s cubic-bezier(.2,.8,.2,1) both;padding-bottom:env(safe-area-inset-bottom)}
.sheetwrap.out .sheet{animation:down .18s ease both}
.sheetwrap.out .scrim{animation:fadeout .18s ease both}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes down{to{transform:translateY(60px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--faint);opacity:.5;margin:8px auto 0}
.shead{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 4px 20px}
.shead h2{font:500 1.2rem var(--f-display)}
.sbody{overflow-y:auto;padding:6px 20px 20px;-webkit-overflow-scrolling:touch}
.sfoot{display:flex;gap:10px;padding:12px 20px 14px;border-top:1px solid var(--line);background:#181B36}
.sfoot .btn{flex:1}
.form{display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:.78rem;color:var(--muted);font-weight:500}
.inp{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);resize:vertical}
.inp:focus{outline:2px solid var(--green);outline-offset:0}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 20px,calc(100% - 15px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.row2{display:flex;gap:8px;align-items:center}
.row2 .inp{flex:1}
.subr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.subr input[type=text]{flex:1;min-width:0;min-height:40px;padding:6px 12px;border-radius:12px;border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.subr .chk{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--faint);display:grid;place-items:center;color:transparent;flex:none}
.subr .chk.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
.mlist{display:flex;flex-direction:column;gap:2px}
.mlist button{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 6px;border-radius:12px;font-weight:500}
.mlist button:hover,.mlist button:active{background:var(--green-soft)}
.mlist button.red{color:var(--terra)}
.mlist button svg{color:var(--muted)}
.mlist button.red svg{color:var(--terra)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:var(--on-accent)}
.sw:not(.sel) svg{opacity:0}
.icons{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.icb{height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.icb.sel{background:var(--green);color:var(--on-green);box-shadow:none}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{min-width:28px;text-align:center;font:500 1.2rem var(--f-display)}
.dayopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dayopts button{padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:500}
.dayopts small{display:block;color:var(--muted);font-weight:400}
.assign{padding:12px 0;border-bottom:1px solid var(--line)}
.assign:last-child{border:0}
.assign .nm{font-weight:500;margin-bottom:8px}
.assign .chips .chip{min-height:32px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.tile b{display:block;font:500 1.6rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{font-size:.78rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font:10.5px var(--f-body)}
.chart .tv{fill:var(--ink);font-weight:500}
.hbar{display:grid;grid-template-columns:96px 1fr 28px;gap:8px;align-items:center;font-size:.85rem;margin-bottom:8px}
.hbar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.hbar .b{height:10px;border-radius:6px;background:var(--green-soft);overflow:hidden}
.hbar .b i{display:block;height:100%;border-radius:6px;background:var(--c,var(--green))}
.hbar .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mini button,.mini div{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:.82rem;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-variant-numeric:tabular-nums}
.mini .hh{background:none;box-shadow:none;aspect-ratio:auto;font-size:.7rem;color:var(--muted)}
.mini .on{background:var(--hc);color:var(--on-accent);box-shadow:none}
.mini .fut{opacity:.35;pointer-events:none}
.mini .t{box-shadow:inset 0 0 0 2px var(--hc)}
.mini .on.t{box-shadow:none}
textarea.big{min-height:180px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
.tgl .sw2{width:50px;height:30px;border-radius:15px;background:var(--faint);position:relative;transition:background .2s;flex:none;opacity:.7}
.tgl .sw2::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl.on .sw2{background:var(--green);opacity:1}
.tgl.on .sw2::after{transform:translateX(20px)}
.notice{padding:12px 14px;border-radius:14px;background:var(--green-soft);color:var(--ink);font-size:.88rem}
.revlist .assign .nm{margin-bottom:6px}

/* toasts / reminders */
#toasts{position:fixed;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:70;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .22s ease both;max-width:100%}
.toast button{color:var(--sand);font-weight:600;white-space:nowrap}
#remind{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px;pointer-events:none}
.rem{pointer-events:auto;width:100%;max-width:520px;background:var(--card);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:14px 16px;border-left:4px solid var(--sand);animation:down2 .25s ease both}
@keyframes down2{from{transform:translateY(-20px);opacity:0}}
.rem b{display:block;font-weight:500}
.rem .acts{display:flex;gap:8px;margin-top:10px}
.rem .acts .btn{min-height:36px;font-size:.88rem;padding:0 14px}
@media (max-width:400px){.title{font-size:1.55rem}.pstats b{font-size:1.3rem}.prog{gap:12px}}
</style>
</head>
<body>
<div class="space" aria-hidden="true"><div class="stars"></div><div class="stars b"></div></div>
<div id="app">
  <main id="scroll" aria-live="polite"></main>
  <div id="qa" hidden>
    <div id="qachips"></div>
    <form id="qaform" autocomplete="off">
      <input id="qainput" type="text" aria-label="Новая задача" enterkeyhint="done" autocomplete="off">

    </form>
  </div>
  <nav id="tabs" aria-label="Разделы"></nav>
</div>
<div id="sheets"></div>
<div id="toasts" aria-live="polite"></div>
<div id="remind"></div>

<script>
(()=>{
'use strict';

/* ───────── utils ───────── */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const todayS=()=>iso(new Date());
const wd=s=>(pd(s).getDay()+6)%7;
const monday=s=>addDays(s,-wd(s));
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const clone=o=>JSON.parse(JSON.stringify(o));
const plural=(n,f)=>{const a=Math.abs(n)%100,b=a%10;return f[(a>10&&a<20)?2:b>1&&b<5?1:b===1?0:2]};
const MON_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON_S=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MON_N=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD_S=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WD_L=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const WD_EACH=['каждый понедельник','каждый вторник','каждую среду','каждый четверг','каждую пятницу','каждую субботу','каждое воскресенье'];
const fmtLong=s=>{const d=pd(s);return `${WD_L[wd(s)]}, ${d.getDate()} ${MON_G[d.getMonth()]}`};
const fmtShort=s=>{const d=pd(s);return `${d.getDate()} ${MON_S[d.getMonth()]}`};
const relDay=s=>{const n=diff(s,todayS());if(n===0)return'Сегодня';if(n===1)return'Завтра';if(n===-1)return'Вчера';if(n===2)return'Послезавтра';return `${WD_S[wd(s)]}, ${fmtShort(s)}`};
const weekLabel=m=>{const a=pd(m),b=pd(addDays(m,6));return a.getMonth()===b.getMonth()?`${a.getDate()} – ${b.getDate()} ${MON_G[b.getMonth()]}`:`${a.getDate()} ${MON_S[a.getMonth()]} – ${b.getDate()} ${MON_S[b.getMonth()]}`};
const haptic=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
const COLORS=['#B6ADF3','#F3C9A0','#F2A3B4','#8FC0F0','#C4A0EC','#9EDCC6','#80D2DE','#F2E3A2'];
const OLD_COLORS=['#466B57','#C6A77B','#B5654A','#5B7C99','#8A6A8E','#8A8F4E','#3F8A87','#B8707E'];

/* ───────── icons ───────── */
const P=d=>`<path d="${d}"/>`;
const ICONS={
  check:P('M5 12.5l4.5 4.5L19 7.5'), plus:P('M12 5v14M5 12h14'), x:P('M6 6l12 12M18 6L6 18'),
  today:`<circle cx="12" cy="12" r="4.2"/><ellipse cx="12" cy="12" rx="9.5" ry="3.4" transform="rotate(-22 12 12)"/>`,
  rocket:P('M12 3c3 2 5 5 5 9l-2 3H9l-2-3c0-4 2-7 5-9zM9 15l-2.5 4 3.5-1M15 15l2.5 4-3.5-1')+`<circle cx="12" cy="10" r="1.5"/>`,
  cal:`<rect x="4" y="5" width="16" height="15" rx="3"/>`+P('M4 10h16M8 3v4M16 3v4'),
  list:P('M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01'),
  flame:P('M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.2 1 2 2 2 0-3-.5-5 1-8z'),
  note:P('M6 4h12a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM9 9h6M9 13h6M9 17h3'),
  chart:P('M5 20V10M12 20V4M19 20v-7'),
  sliders:P('M4 7h10M18 7h2M4 17h2M10 17h10')+`<circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>`,
  trash:P('M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3'),
  clock:`<circle cx="12" cy="12" r="9"/>`+P('M12 7v5l3 2'),
  repeat:P('M17 2l3 3-3 3M20 5H8a4 4 0 0 0-4 4v1M7 22l-3-3 3-3M4 19h12a4 4 0 0 0 4-4v-1'),
  flag:P('M5 21V4M5 4h11l-2 4 2 4H5'),
  star:P('M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z'),
  chevL:P('M15 5l-7 7 7 7'), chevR:P('M9 5l7 7-7 7'), chevD:P('M6 9l6 6 6-6'),
  grip:P('M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01'),
  search:`<circle cx="11" cy="11" r="6.5"/>`+P('M20 20l-4.2-4.2'),
  copy:P('M9 9h11v11H9zM5 15V4h11'),
  moon:P('M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z'),
  inbox:P('M4 13l2-8h12l2 8v6H4zM4 13h5a3 3 0 0 0 6 0h5'),
  alert:`<circle cx="12" cy="12" r="9"/>`+P('M12 8v5M12 16.5h.01'),
  arrow:P('M5 12h14M13 6l6 6-6 6'),
  bell:P('M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0'),
  pin:P('M12 17v5M8 4h8l-1 6 3 3H6l3-3z'),
  edit:P('M4 20l4-1 11-11-3-3L5 16zM14 6l3 3'),
  sub:P('M5 5v8a3 3 0 0 0 3 3h10M14 12l4 4-4 4'),
  book:P('M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h10'),
  drop:P('M12 3c3.5 4.5 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 2.5-6.5 6-11z'),
  dumbbell:P('M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12'),
  globe:`<circle cx="12" cy="12" r="9"/>`+P('M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18'),
  sun:`<circle cx="12" cy="12" r="3.6"/>`+P('M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4'),
  heart:P('M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z'),
  pen:P('M4 20l4-1 11-11-3-3L5 16zM14 6l3 3'),
  leaf:P('M5 19c0-8 5-13 14-14 0 9-5 14-13 14zM5 19c2-4 5-7 9-9'),
  music:P('M9 18V6l10-2v12')+`<circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>`,
  coffee:P('M5 8h11v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4zM16 9h2a2 2 0 0 1 0 4h-2M8 3v2M12 3v2'),
};
const HICONS=['book','drop','dumbbell','globe','moon','sun','heart','pen','leaf','music','coffee','star','rocket','today'];
const ic=(n,s=22,sw=1.8)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ───────── state ───────── */
const LS='dayflow.v1', LS_FIRED='dayflow.fired';
const defCats=()=>[{id:'c_work',name:'Работа',color:COLORS[0]},{id:'c_life',name:'Личное',color:COLORS[1]},{id:'c_study',name:'Учёба',color:COLORS[3]}];
const emptyState=()=>({v:1,updatedAt:0,settings:{name:'',morning:true,morningAt:'08:00',evening:true,eveningAt:'21:00'},cats:defCats(),tasks:[],focus:{},habits:[],notes:[],reviews:{}});
function migrate(s){const e=emptyState();s=s&&typeof s==='object'?s:e;for(const k in e){if(s[k]===undefined)s[k]=e[k]}s.settings={...e.settings,...s.settings};
  const rc=c=>{const i=OLD_COLORS.indexOf(c.color);if(i>=0)c.color=COLORS[i]};(s.cats||[]).forEach(rc);(s.habits||[]).forEach(rc);
  s.tasks.forEach(t=>{t.subs=t.subs||[];t.doneMap=t.doneMap||{};t.skip=t.skip||[];t.ord=t.ord||0;if(t.pri==null)t.pri=1});return s}

function seed(){
  const t0=todayS(), m=monday(t0), D=i=>addDays(m,i), L=i=>addDays(m,i-7);
  const S0=emptyState();
  S0.cats=[{id:'c_work',name:'Работа',color:COLORS[0]},{id:'c_life',name:'Личное',color:COLORS[1]},{id:'c_study',name:'Учёба',color:COLORS[3]},{id:'c_home',name:'Дом',color:COLORS[6]},{id:'c_proj',name:'Проект',color:COLORS[5]},{id:'c_shop',name:'Покупки',color:COLORS[7]}];
  let n=0;
  const T=(title,o={})=>({id:uid(),title,details:'',created:Date.now(),date:null,time:null,pri:1,cat:null,remind:null,rec:null,subs:[],done:false,doneAt:null,doneMap:{},skip:[],ord:(n++)*10,demo:true,...o});
  const S=(a)=>a.map(x=>({id:uid(),t:x,d:false}));
  const list=[
    T('Проверить рабочую почту',{date:D(0),time:'09:00',cat:'c_work',rec:{t:'w',every:1,days:[0,1,2,3,4]}}),
    T('Тренировка',{date:D(1),time:'19:00',cat:'c_life',rec:{t:'w',every:1,days:[1,3,5]},remind:30}),
    T('Позвонить по важному вопросу',{date:D(0),time:'11:30',cat:'c_life',pri:2}),
    T('Планёрка по проекту',{date:D(1),time:'10:00',cat:'c_work',pri:2,remind:10}),
    T('Разобрать шкаф',{date:D(2),time:'12:00',cat:'c_home'}),
    T('Изучить новый материал',{date:D(2),time:'15:00',cat:'c_study',subs:S(['Прочитать главу','Выписать вопросы','Сделать конспект'])}),
    T('Сделать первый шаг по проекту',{date:D(3),cat:'c_proj'}),
    T('Подготовить отчёт',{date:D(3),cat:'c_work',pri:2,subs:S(['Собрать данные','Написать выводы'])}),
    T('Купить продукты',{date:D(4),time:'18:00',cat:'c_shop',subs:S(['Молоко','Хлеб','Овощи'])}),
    T('Разобрать почту и бумаги',{date:D(5),cat:'c_life'}),
    T('Обзор недели',{date:D(6),time:'20:00',cat:'c_life'}),
    T('Записаться к врачу',{cat:'c_life'}),
    T('Купить новый ежедневник',{cat:'c_shop'}),
    T('Прошлая неделя: отправить документ',{date:L(1),cat:'c_work',done:true,doneAt:pd(L(1)).getTime()+4e7}),
    T('Прошлая неделя: созвон с командой',{date:L(2),time:'10:00',cat:'c_work',done:true,doneAt:pd(L(2)).getTime()+4e7}),
    T('Прошлая неделя: прочитать статью',{date:L(2),cat:'c_study',done:true,doneAt:pd(L(2)).getTime()+5e7}),
    T('Прошлая неделя: оплатить счета',{date:L(3),cat:'c_life',done:true,doneAt:pd(L(3)).getTime()+3e7}),
    T('Прошлая неделя: сдать черновик',{date:L(4),cat:'c_proj',done:true,doneAt:pd(L(4)).getTime()+5e7}),
    T('Прошлая неделя: план на неделю',{date:L(6),cat:'c_life',done:true,doneAt:pd(L(6)).getTime()+6e7}),
  ];
  list.forEach(t=>{ if(t.title.startsWith('Прошлая неделя: ')) t.title=t.title.replace('Прошлая неделя: ','').replace(/^./,c=>c.toUpperCase());

/* ───────── sync (per-user private doc, falls back to localStorage) ───────── */
const remote={ref:null,busy:false,pending:false,timer:null,status:'local',size:0};
function scheduleRemote(){ if(!remote.ref) return; clearTimeout(remote.timer); remote.timer=setTimeout(flushRemote,700); }
async function flushRemote(){
  if(!remote.ref) return;
  if(remote.busy){remote.pending=true;return}
  remote.busy=true;
  try{
    const json=JSON.stringify(S); remote.size=json.length;
    if(json.length>240000){remote.status='big';toast('Данных слишком много для синхронизации. Сделайте резервную копию и удалите старое.',{ms:6000});}
    else{ await remote.ref.set({updatedAt:S.updatedAt,json}); remote.status='ok'; remote.fails=0; }
  }catch(e){
    const code=e&&e.code;
    if(code==='invalid_argument'||code==='revoked'||code==='not_granted'||code==='capability_disabled'||code==='quota_exceeded'||(remote.fails=(remote.fails||0)+1)>4){
      remote.ref=null; remote.status='local';
    }else{
      remote.status='err';
      setTimeout(()=>{remote.pending=true;if(!remote.busy)flushRemote()},5000*remote.fails);
    }
  }
  remote.busy=false;
  if(remote.pending){remote.pending=false;flushRemote()}
}
function onRemote(snap){
  if(snap.metadata&&snap.metadata.hasPendingWrites) return;
  if(!snap.exists){ if(snap.metadata&&snap.metadata.fromCache) return; remote.status='ok'; scheduleRemote(); return; }
  const d=snap.data()||{};
  let rs=null; try{rs=JSON.parse(d.json)}catch(e){}
  if(!rs){remote.status='ok';return}
  remote.status='ok';
  if((d.updatedAt||0)>(S.updatedAt||0)){ S=migrate(rs); S.updatedAt=d.updatedAt||0; saveLocal(); render(); refreshSheets(); }
  else if((d.updatedAt||0)<(S.updatedAt||0)){ scheduleRemote(); }
}
async function initRemote(){
  try{
    const c=window.claude; if(!c||!c.use) return;
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    remote.ref=db.collection('data/users/'+id).doc('state'); remote.status='wait';
    const t=setTimeout(()=>{if(remote.status==='wait')remote.status='slow'},10000);
    remote.ref.onSnapshot(s=>{clearTimeout(t);onRemote(s)},()=>{clearTimeout(t);remote.status='err'});
  }catch(e){remote.status='local'}
}

function nextOcc(t){const T=todayS();if(!t.rec)return t.date||T;for(let i=0;i<400;i++){const ds=addDays(T,i);if(occursOn(t,ds))return ds}return t.date}
const overdueList=()=>{const T=todayS();return S.tasks.filter(t=>!t.rec&&!t.done&&t.date&&t.date<T).sort((a,b)=>a.date.localeCompare(b.date))};
const inboxList=()=>S.tasks.filter(t=>!t.rec&&!t.done&&!t.date).sort((a,b)=>a.ord-b.ord);

/* ───────── quick-add parser ───────── */
const WDRE='(понедельник|вторник|сред[ауы]|четверг|пятниц[ауы]|суббот[ауы]|воскресень[еяю])';
const wdIdx=w=>({пон:0,вто:1,сре:2,чет:3,пят:4,суб:5,вос:6})[w.toLowerCase().slice(0,3)];
const NUMW={один:1,одну:1,два:2,две:2,три:3,четыре:4,пять:5,шесть:6,семь:7,восемь:8,девять:9,десять:10};

function parseQuick(raw,base){
  let s=' '+raw+' ';
  const out={title:'',date:null,time:null,pri:1,cat:null,rec:null};
  const E='(?=$|[\\s,.;!?])', B='(^|[\\s,;])';
  const take=(re,fn)=>{const m=s.match(re);if(!m)return false;if(fn(m)===false)return false;s=s.replace(re,'$1');return true};
  const R=(src)=>new RegExp(B+src+E,'iu');
  take(R('(?:каждый\\s+день|ежедневно)'),()=>{out.rec={t:'d',every:1}});
  if(!out.rec) take(R('(?:по\\s+будням|каждый\\s+будний\\s+день)'),()=>{out.rec={t:'w',every:1,days:[0,1,2,3,4]}});
  if(!out.rec) take(R('кажд(?:ый|ую|ое)\\s+'+WDRE),m=>{out.rec={t:'w',every:1,days:[wdIdx(m[2])]}});
  if(!out.rec) take(R('(?:кажд\\S*\\s+недел\\S*|еженедельно)'),()=>{out.rec={t:'w',every:1,days:null}});
  if(!out.rec) take(R('(?:кажд\\S*\\s+месяц\\S*|ежемесячно)'),()=>{out.rec={t:'m',every:1}});
  const T=todayS();
  take(R('послезавтра'),()=>{out.date=addDays(T,2)});
  if(!out.date) take(R('завтра'),()=>{out.date=addDays(T,1)});
  if(!out.date) take(R('сегодня'),()=>{out.date=T});
  if(!out.date) take(R('через\\s+(\\d+|один|одну|два|две|три|четыре|пять|шесть|семь|восемь|девять|десять)\\s+(дн\\S*|день|недел\\S*|месяц\\S*)'),m=>{
    const n=/^\d+$/.test(m[2])?+m[2]:NUMW[m[2].toLowerCase()];const u=m[3][0].toLowerCase();
    out.date=u==='д'?addDays(T,n):u==='н'?addDays(T,n*7):(()=>{const d=pd(T);d.setMonth(d.getMonth()+n);return iso(d)})()});
  if(!out.date) take(R('(?:в|во|на)\\s+'+WDRE),m=>{out.date=nextWd(wdIdx(m[2]),false)});
  if(!out.date) take(R('(\\d{1,2})\\.(\\d{1,2})(?:\\.(\\d{2,4}))?'),m=>{

    let ds=iso(new Date(y,mm-1,dd));if(!m[4]&&ds<T)ds=iso(new Date(y+1,mm-1,dd));out.date=ds});
  take(R('(?:в|к)\\s+(\\d{1,2}):(\\d{2})'),m=>{const h=+m[2],mi=+m[3];if(h>23||mi>59)return false;out.time=pad(h)+':'+pad(mi)});

    let h=+m[2];if(h>24||h<0)return false;const p=(m[3]||'').toLowerCase();
    if(p==='утра'){if(h===12)h=0}else if(p==='вечера'){if(h<12)h+=12}else if(p==='дня'){if(h<12&&h>=1&&h!==12)h+=12}else if(p==='ночи'){if(h===12)h=0;else if(h>=9)h+=12}
    if(h>23)h=0;out.time=pad(h)+':00'});
  take(R('(?:!{1,3}|срочно|важно)'),()=>{out.pri=2});
  take(R('#([\\p{L}\\d_-]+)'),m=>{const c=S.cats.find(c=>c.name.toLowerCase().startsWith(m[2].toLowerCase()));if(c)out.cat=c.id});
  const found={date:!!out.date,time:!!out.time};
  if(out.rec){ if(out.rec.t==='w'&&!out.rec.days){ out.rec.days=[wd(out.date||base||T)] }
    if(!out.date){ out.date= out.rec.t==='w'&&out.rec.days.length? (()=>{for(let k=0;k<8;k++){const ds=addDays(base||T,k);if(out.rec.days.includes(wd(ds)))return ds}return base||T})() : (base||T) } }

  return out;
}

function dayDots(ds){

  const secs=days.map(ds=>{const its=sortItems(itemsOn(ds)),d=its.filter(i=>i.done).length;

function smartCounts(){

const SMART=[['inbox','Входящие','inbox'],['today','Сегодня','today'],['planned','Запланировано','cal'],['important','Важно','flag'],['overdue','Просрочено','alert'],['done','Выполнено','check']];

function searchHtml(q){
  q=q.trim().toLowerCase(); if(!q) return '';
  const r=S.tasks.filter(t=>(t.title+' '+t.details+' '+t.subs.map(s=>s.t).join(' ')+' '+((catOf(t.cat)||{}).name||'')).toLowerCase().includes(q)).slice(0,50);
  return r.length?`<div class="list" style="margin-top:14px">${r.map(t=>rowHtml({t,ds:t.rec?nextOcc(t):(t.date||''),done:t.rec?isDone(t,nextOcc(t)):t.done},{showDate:true})).join('')}</div>`:`<div class="empty" style="margin-top:14px">Ничего не найдено.</div>`;

function listGroups(kind){
  const T=todayS(), nr=S.tasks.filter(t=>!t.rec), und=nr.filter(t=>!t.done);
  const mk=(t,ds)=>({t,ds:ds||'',done:t.rec?isDone(t,ds):t.done});
  if(kind==='inbox') return [{title:null,items:inboxList().map(t=>mk(t,'')),sort:'inbox'}];
  if(kind==='today') return [{title:null,items:sortItems(itemsOn(T))}];
  if(kind==='planned'){
    const byDate={}; und.filter(t=>t.date&&t.date>T).forEach(t=>(byDate[t.date]=byDate[t.date]||[]).push(mk(t,t.date)));
    const g=Object.keys(byDate).sort().map(d=>({title:relDay(d),items:byDate[d]}));
    const rec=S.tasks.filter(t=>t.rec).map(t=>mk(t,nextOcc(t))); if(rec.length) g.push({title:'Повторяющиеся',items:rec});
    return g;
  }
  if(kind==='important'){
    const it=S.tasks.filter(t=>t.pri===2&&(t.rec||!t.done)).map(t=>mk(t,t.rec?nextOcc(t):(t.date||''))).filter(i=>!i.done);
    return [{title:null,items:it.sort((a,b)=>(a.ds||'9').localeCompare(b.ds||'9'))}];
  }
  if(kind==='overdue'){ const byD={}; overdueList().forEach(t=>(byD[t.date]=byD[t.date]||[]).push(mk(t,t.date))); return Object.keys(byD).sort().map(d=>({title:relDay(d),items:byD[d]})); }
  if(kind==='done'){
    const items=[]; nr.filter(t=>t.done).forEach(t=>items.push({t,ds:iso(new Date(t.doneAt||Date.now())),done:true}));
    S.tasks.filter(t=>t.rec).forEach(t=>Object.keys(t.doneMap).forEach(ds=>items.push({t,ds,done:true})));
    const by={}; items.sort((a,b)=>b.ds.localeCompare(a.ds)).slice(0,120).forEach(i=>(by[i.ds]=by[i.ds]||[]).push(i));
    return Object.keys(by).sort().reverse().map(d=>({title:relDay(d),items:by[d]}));
  }
  if(kind.startsWith('cat:')){
    const id=kind.slice(4), ts=S.tasks.filter(t=>t.cat===id), g=[];
    const ov=ts.filter(t=>!t.rec&&!t.done&&t.date&&t.date<T).sort((a,b)=>a.date.localeCompare(b.date)).map(t=>mk(t,t.date)); if(ov.length) g.push({title:'Просрочено',items:ov});
    const td=ts.filter(t=>occursOn(t,T)).map(t=>mk(t,T)); if(td.length) g.push({title:'Сегодня',items:td});
    const up=ts.filter(t=>!t.rec&&!t.done&&t.date&&t.date>T).sort((a,b)=>a.date.localeCompare(b.date)).map(t=>mk(t,t.date)); if(up.length) g.push({title:'Запланировано',items:up});
    const rc=ts.filter(t=>t.rec&&!occursOn(t,T)).map(t=>mk(t,nextOcc(t))); if(rc.length) g.push({title:'Повторяющиеся',items:rc});
    const nd=ts.filter(t=>!t.rec&&!t.done&&!t.date).map(t=>mk(t,'')); if(nd.length) g.push({title:'Без даты',items:nd});
    const dn=ts.filter(t=>!t.rec&&t.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,8).map(t=>mk(t,'')); if(dn.length) g.push({title:'Выполнено',items:dn});
    return g;
  }
  return [];
}
function viewList(kind){

  const g=listGroups(kind).filter(x=>x.items.length);

/* ───────── render ───────── */
const TABS=[['today','Сегодня','today'],['week','Неделя','cal'],['tasks','Задачи','list'],['habits','Привычки','flame'],['notes','Заметки','note']];
function render(){

  const view={today:viewToday,week:viewPlan,tasks:viewTasks,habits:viewHabits,notes:viewNotes}[ui.tab]();
  sc.style.scrollBehavior='auto'; sc.innerHTML=view; sc.scrollTop=ui.keep?y:0; ui.keep=true; sc.style.scrollBehavior='';

}
function qaBase(){
  if(ui.tab==='today') return {date:todayS(),cat:null};
  if(ui.list==='today') return {date:todayS(),cat:null};
  if(ui.list&&ui.list.startsWith('cat:')) return {date:null,cat:ui.list.slice(4)};

function setTab(k,reset=true){ ui.tab=k; if(k!=='tasks'){ui.list=null} ui.keep=!reset; if(k==='week'&&ui.mode==='week'&&ui.week===monday(todayS())) ui.scrollTo='day-'+todayS(); try{history.replaceState(null,'','#'+k)}catch(e){location.hash=k} render(); }

/* ───────── sheets / toasts ───────── */
function sheet(title,body,foot=''){
  const w=document.createElement('div'); w.className='sheetwrap';
  w.innerHTML=`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="shead"><h2>${esc(title)}</h2><button class="iconbtn" data-act="close" aria-label="Закрыть">${ic('x',20)}</button></div><div class="sbody">${body}</div>${foot?`<div class="sfoot">${foot}</div>`:''}</div>`;
  $('#sheets').appendChild(w); return w;
}
function closeSheet(w){ if(!w) return; if(w.classList.contains('out')) return; w.classList.add('out'); setTimeout(()=>{w.remove()},180); }
function refreshSheets(){ $$('.sheetwrap').forEach(w=>{ if(w._refresh&&!w.classList.contains('out')) w._refresh() }); }
function toast(msg,o={}){
  const box=$('#toasts'); while(box.children.length>=2) box.firstElementChild.remove();
  const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<span>${esc(msg)}</span>${o.undo?'<button type="button">Отменить</button>':''}`;
  if(o.undo) t.querySelector('button').onclick=()=>{o.undo();t.remove()};
  box.appendChild(t); setTimeout(()=>t.remove(),o.ms||4200);
}
function confirmBox(msg,yes,label='Удалить'){
  const w=sheet('Подтвердите',`<p>${esc(msg)}</p>`,`<button class="btn line" data-act="close">Отмена</button><button class="btn danger" data-s="yes">${esc(label)}</button>`);
  w.addEventListener('click',e=>{if(e.target.closest('[data-s="yes"]')){closeSheet(w);yes()}});
}
function pickDay(title,cb){
  const T=todayS(); const opts=[[T,'Сегодня'],[addDays(T,1),'Завтра'],[addDays(T,2),'Послезавтра'],[addDays(T,7),'Через неделю']];
  const w=sheet(title,`<div class="dayopts">${opts.map(([d,n])=>`<button data-s="d" data-d="${d}">${n}<small>${esc(fmtShort(d))}</small></button>`).join('')}</div>
    <div class="fld" style="margin-top:16px"><span class="lbl">Другая дата</span><div class="row2"><input type="date" class="inp" id="pd-date" aria-label="Другая дата"><button class="btn" data-s="date">Выбрать</button></div></div>`);
  w.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;
    if(b.dataset.s==='d'){closeSheet(w);cb(b.dataset.d)} else if(b.dataset.s==='date'){const v=$('#pd-date',w).value;if(v){closeSheet(w);cb(v)}}});

  </div>`,`${t?`<button class="btn danger" data-s="del" style="flex:0 0 auto" aria-label="Удалить">${ic('trash',18)}</button>`:''}<button class="btn" data-s="save">Сохранить</button>`);
  const q=s=>$(s,w);

/* stats */
function barChart(vals,labels,{color='var(--green)',hi=-1}={}){
  const W=320,H=150,pl=24,pr=6,pt=16,pb=22,iw=W-pl-pr,ih=H-pt-pb,n=vals.length,top=Math.max(1,...vals),bw=Math.min(28,iw/n*.62);
  const y=v=>pt+ih-(v/top)*ih; let g=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/><line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(top)}" y2="${y(top)}"/>`;
  g+=`<text x="${pl-5}" y="${y(0)+3}" text-anchor="end">0</text><text x="${pl-5}" y="${y(top)+3}" text-anchor="end">${top}</text>`;
  vals.forEach((v,i)=>{const cx=pl+iw/n*(i+.5),x=cx-bw/2,h=(v/top)*ih;
    if(v>0)g+=`<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}" opacity="${hi<0||hi===i?1:.55}"/>`;
    if(v>0&&n<=12)g+=`<text class="tv" x="${cx.toFixed(1)}" y="${(y(v)-4).toFixed(1)}" text-anchor="middle">${v}</text>`;
    if(n<=12||i%5===0||i===n-1)g+=`<text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Столбчатая диаграмма">${g}</svg>`;
}
function statsData(){
  const T=todayS(); let buckets=[],label='';
  if(ui.sr==='w'){const m=addDays(monday(T),ui.so*7);buckets=[...Array(7)].map((_,i)=>({days:[addDays(m,i)],lab:WD_S[i]}));label=weekLabel(m)}
  else if(ui.sr==='m'){const d=pd(T);d.setMonth(d.getMonth()+ui.so,1);const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();buckets=[...Array(dim)].map((_,i)=>({days:[iso(new Date(d.getFullYear(),d.getMonth(),i+1))],lab:String(i+1)}));label=MON_N[d.getMonth()]+' '+d.getFullYear()}
  else{const y=pd(T).getFullYear()+ui.so;buckets=[...Array(12)].map((_,mi)=>{const dim=new Date(y,mi+1,0).getDate();return{days:[...Array(dim)].map((_,i)=>iso(new Date(y,mi,i+1))),lab:MON_S[mi]}});label=String(y)}
  const comp={}; const catC={}; const inRange=new Set(buckets.flatMap(b=>b.days));
  const addComp=(ds,t)=>{comp[ds]=(comp[ds]||0)+1;if(inRange.has(ds)){const k=t.cat||'';catC[k]=(catC[k]||0)+1}};
  S.tasks.forEach(t=>{if(t.rec)Object.keys(t.doneMap).forEach(ds=>addComp(ds,t));else if(t.done&&t.doneAt)addComp(iso(new Date(t.doneAt)),t)});
  const hv=[],tv=[]; let planned=0,donePl=0,hexp=0,hgot=0;
  buckets.forEach(b=>{let c=0,hc=0;b.days.forEach(ds=>{c+=comp[ds]||0;S.habits.forEach(h=>{if(h.log[ds])hc++});
    if(ds<=T){const its=itemsOn(ds);planned+=its.length;donePl+=its.filter(i=>i.done).length;S.habits.forEach(h=>{hexp+=h.freq.t==='w'?h.freq.n/7:(isSched(h,ds)?1:0);if(h.log[ds])hgot++})}});tv.push(c);hv.push(hc)});
  return {buckets,label,tv,hv,planned,donePl,hrate:hexp?Math.min(1,hgot/hexp):0,catC,sum:tv.reduce((a,b)=>a+b,0),hsum:hv.reduce((a,b)=>a+b,0)};
}

      <div class="tiles"><div class="tile"><b>${D.sum}</b><span>Выполнено задач</span></div><div class="tile"><b>${D.planned?Math.round(D.donePl/D.planned*100):0}%</b><span>Плана выполнено</span></div><div class="tile"><b>${D.hsum}</b><span>Отметок привычек</span></div><div class="tile"><b>${Math.round(D.hrate*100)}%</b><span>Привычек в ритме</span></div></div>

  w._refresh=paint; paint();
  w.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;const k=b.dataset.s;if(k==='r'){ui.sr=b.dataset.v;ui.so=0}else if(k==='p')ui.so--;else if(k==='n')ui.so++;paint()});

function backupSheet(){
  const w=sheet('Резервная копия',`<div class="form"><div class="fld"><span class="lbl">Ваши данные (JSON)</span><textarea id="bk-out" class="inp" rows="5" readonly></textarea><div class="chips"><button class="chip" data-s="copy">${ic('copy',14)}Скопировать</button><button class="chip" data-s="csv">${ic('copy',14)}Задачи в CSV</button><button class="chip" data-s="dl">${ic('copy',14)}Скачать файл</button></div></div>
    <div class="fld"><span class="lbl">Восстановить из копии</span><textarea id="bk-in" class="inp" rows="4" placeholder="Вставьте сюда скопированный JSON"></textarea><div class="chips"><button class="chip" data-s="apply">Восстановить из текста</button><label class="chip plain" style="cursor:pointer">Выбрать файл<input type="file" id="bk-file" accept=".json,application/json,text/plain" hidden></label></div></div>
    <p class="small">Файл с копией можно сохранить в «Файлы» или отправить себе в мессенджер. Чтобы восстановить данные, выберите этот файл или вставьте его текст.</p></div>`);
  const out=$('#bk-out',w); out.value=JSON.stringify(S);
  const copyText=async txt=>{try{await navigator.clipboard.writeText(txt);toast('Скопировано')}catch(e){out.value=txt;out.select();toast('Выделено. Скопируйте вручную.')}};
  const restore=txt=>{let o;try{o=JSON.parse(txt)}catch(e){toast('Не удалось прочитать данные. Проверьте, что текст скопирован полностью.',{ms:5000});return}
    if(!o||!Array.isArray(o.tasks)||!Array.isArray(o.habits)){toast('Это не копия DayFlow.');return}
    confirmBox('Заменить текущие данные восстановленными?',()=>{S=migrate(o);commit();closeSheet(w);toast('Данные восстановлены')},'Заменить')};
  w.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;const k=b.dataset.s;
    if(k==='copy')copyText(JSON.stringify(S)); else if(k==='csv'){const c=csvOf();out.value=c;copyText(c)} else if(k==='apply')restore($('#bk-in',w).value.trim()); else if(k==='dl'){try{const bl=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='dayflow-'+todayS()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},500);toast('Файл сохранён')}catch(e){copyText(JSON.stringify(S))}}});
  $('#bk-file',w).addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(String(r.result));r.readAsText(f)});
}

/* welcome */
function welcomeSheet(){
  const w=sheet('Добро пожаловать',`<div class="form"><p>DayFlow помогает спланировать неделю, отмечать задачи и привычки и видеть свой прогресс. Всё хранится на этом телефоне, регистрация не нужна.</p><label class="fld"><span class="lbl">Как к вам обращаться</span><input id="wl-name" class="inp" autocomplete="off" placeholder="Ваше имя"></label><p class="small">Откройте «Настройки → Резервная копия» и иногда сохраняйте копию данных, чтобы ничего не потерять.</p></div>`,`<button class="btn ghost" data-s="demo">С примерами</button><button class="btn" data-s="go">Начать</button>`);
  w.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;const nm=$('#wl-name',w).value.trim();
    if(b.dataset.s==='go'){S.settings.name=nm;commit();closeSheet(w)} else if(b.dataset.s==='demo'){const d=seed();d.settings.name=nm;S=d;commit();closeSheet(w)}});
  setTimeout(()=>{try{$('#wl-name',w).focus()}catch(e){}},300);
}

/* reviews */
function reviewSheet(kind){
  const T=todayS(); const w=sheet(kind==='m'?'Утренний обзор':'Вечерний обзор','<div id="rv-body"></div>',`<button class="btn" data-s="fin">${kind==='m'?'Начать день':'Завершить день'}</button>`);
  const paint=()=>{const its=sortItems(itemsOn(T)),open=its.filter(i=>!i.done),od=overdueList(),hs=habitsFor(T),hd=hs.filter(h=>h.log[T]).length,fo=S.focus[T]||[];
    if(kind==='m'){
      const first=open.find(i=>i.t.time);
      $('#rv-body',w).innerHTML=`<p>${S.settings.name?esc(S.settings.name)+', на':'На'} сегодня ${its.length} ${plural(its.length,['задача','задачи','задач'])}${first?`, первая в ${first.t.time}: ${esc(first.t.title)}`:''}.</p>
        ${od.length?`<button class="banner terra" data-s="od">${ic('alert',20)}<span><b>Просрочено: ${od.length}</b></span><span class="go">Разобрать</span></button>`:''}
        ${secHead('Выберите до трёх главных задач',`${fo.filter(id=>its.some(i=>i.t.id===id)).length} из 3`)}${its.length?listHtml(its,{noCat:true}):'<div class="empty">Задач на сегодня нет.</div>'}
        ${hs.length?secHead('Привычки сегодня')+`<div class="chips">${hs.map(h=>`<span class="chip plain"><i class="dot" style="--c:${h.color}"></i>${esc(h.name)}</span>`).join('')}</div>`:''}`;
    }else{
      $('#rv-body',w).innerHTML=`<div class="tiles"><div class="tile"><b>${its.length-open.length}/${its.length}</b><span>Задач выполнено</span></div><div class="tile"><b>${hd}/${hs.length}</b><span>Привычек отмечено</span></div></div>
        ${open.length?`${secHead('Не выполнено',String(open.length))}<div class="revlist">${open.map(i=>`<div class="assign" data-id="${i.t.id}" data-ds="${i.ds}"><div class="nm">${esc(i.t.title)}</div><div class="chips"><button class="chip" data-s="tm">${i.t.rec?'Пропустить':'На завтра'}</button><button class="chip plain" data-s="dn">Выполнено</button></div></div>`).join('')}</div><button class="btn ghost block" style="margin-top:12px" data-s="allm">Перенести всё на завтра</button><p class="small" style="margin-top:8px">Невыполненное само не исчезает. Оно остаётся в списке и ждёт вашего решения.</p>`:`<div class="empty" style="margin-top:14px">Всё сделано. Хорошего вечера.</div>`}`;
    }};
  w._refresh=paint; paint();
  w.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;const k=b.dataset.s;
    if(k==='fin'){S.reviews[T]=Object.assign(S.reviews[T]||{},{[kind]:true});commit();closeSheet(w)}
    else if(k==='od')overdueSheet();
    else if(k==='allm'){mutate(()=>{itemsOn(T).filter(i=>!i.done).forEach(i=>{if(i.t.rec)i.t.skip.push(T);else i.t.date=addDays(T,1)})},'Перенесено на завтра')}
    else{const a=b.closest('.assign');if(!a)return;if(k==='tm')postponeTask(a.dataset.id,a.dataset.ds);else if(k==='dn')toggleTask(a.dataset.id,a.dataset.ds)}});
}

/* ───────── reminders ───────── */
let fired={}; try{fired=JSON.parse(localStorage.getItem(LS_FIRED)||'{}')}catch(e){}
const snooze={}, shown=new Set();
function checkReminders(){
  const now=new Date(), ts=iso(now); let ch=false;
  Object.keys(fired).forEach(k=>{if(!k.endsWith('|'+ts)){delete fired[k];ch=true}});
  for(const it of itemsOn(ts)){const t=it.t;if(it.done||!t.time||t.remind==null)continue;
    const [h,m]=t.time.split(':').map(Number), at=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m).getTime()-t.remind*60000, key=t.id+'|'+ts, n=Date.now();
    const due=snooze[key]?n>=snooze[key]:(!fired[key]&&n>=at&&n<at+t.remind*60000+4*3600e3);
    if(due&&!shown.has(key)){shown.add(key);fired[key]=1;ch=true;delete snooze[key];showReminder(it,key)}}
  if(ch){try{localStorage.setItem(LS_FIRED,JSON.stringify(fired))}catch(e){}}
}
function showReminder(it,key){
  const d=document.createElement('div'); d.className='rem'; d.setAttribute('role','alert');
  d.innerHTML=`<b>${esc(it.t.title)}</b><span class="small">${it.t.remind?`Через ${it.t.remind>=60?Math.round(it.t.remind/60)+' ч':it.t.remind+' мин'}, в ${it.t.time}`:`Сейчас, ${it.t.time}`}</span><div class="acts"><button class="btn" data-s="d">Готово</button><button class="btn ghost" data-s="s">Через 10 мин</button><button class="btn line" data-s="c">Закрыть</button></div>`;
  d.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;const k=b.dataset.s;
    if(k==='d'){toggleTask(it.t.id,it.ds)} else if(k==='s'){snooze[key]=Date.now()+10*60000;shown.delete(key)}
    d.remove()});
  $('#remind').appendChild(d); haptic();
  try{ if(window.Notification&&Notification.permission==='granted'&&navigator.serviceWorker) navigator.serviceWorker.ready.then(r=>r.showNotification('DayFlow',{body:it.t.title+(it.t.time?' · '+it.t.time:''),tag:key,icon:'icon-192.png'})) }catch(e){}
}

/* ───────── events ───────── */
let noClickUntil=0; const suppress=()=>{noClickUntil=Date.now()+450};
const A={
  tab:el=>setTab(el.dataset.v),
  close:el=>closeSheet(el.closest('.sheetwrap')),
  toggle:el=>{const r=el.closest('.row');toggleTask(r.dataset.id,r.dataset.ds)},
  open:el=>{if(Date.now()<noClickUntil)return;taskSheet(el.closest('.row').dataset.id)},
  focus:el=>{const r=el.closest('.row');toggleFocus(r.dataset.id,r.dataset.ds)},
  time:el=>{if(Date.now()<noClickUntil)return;timeSheet(el.closest('.row').dataset.id)},
  hab:el=>toggleHabit(el.dataset.hid,el.dataset.ds),
  hdetail:el=>habDetail(el.dataset.hid),
  habedit:el=>habSheet(el.dataset.hid||null),
  settings:()=>settingsSheet(), stats:()=>statsSheet(), overdue:()=>overdueSheet(), inbox:()=>inboxSheet(),
  review:el=>reviewSheet(el.dataset.v), clearDemo:()=>clearDemo(),
  newtask:()=>taskSheet(null,{date:ui.tab==='today'?todayS():null}),
  pmode:el=>{ui.mode=el.dataset.v;ui.keep=false;if(ui.mode==='week'&&ui.week===monday(todayS()))ui.scrollTo='day-'+todayS();render()},
  wnav:el=>{ui.week=addDays(ui.week,7*+el.dataset.v);ui.keep=false;render()},
  wtoday:()=>{ui.week=monday(todayS());ui.keep=false;ui.scrollTo='day-'+todayS();render()},
  mnav:el=>{const d=pd(ui.month);d.setMonth(d.getMonth()+ +el.dataset.v);ui.month=iso(d);render()},
  mtoday:()=>{ui.month=todayS().slice(0,8)+'01';render()},
  day:el=>daySheet(el.dataset.ds),
  gotoDay:el=>{const d=document.getElementById('day-'+el.dataset.ds);if(d)$('#scroll').scrollTo({top:d.offsetTop-96,behavior:'smooth'})},
  copyWeek:()=>{const m=ui.week,lo=m,hi=addDays(m,6);const src=S.tasks.filter(t=>!t.rec&&t.date&&t.date>=lo&&t.date<=hi);
    if(!src.length){toast('На этой неделе нет задач для копирования');return}
    mutate(()=>{src.forEach(t=>{const c=clone(t);c.id=uid();c.date=addDays(t.date,7);c.done=false;c.doneAt=null;c.doneMap={};c.skip=[];c.subs=c.subs.map(s=>({...s,id:uid(),d:false}));c.ord=maxOrd()+10;delete c.demo;S.tasks.push(c)})},`Скопировано задач: ${src.length}`);
    ui.week=addDays(ui.week,7);ui.keep=false;render()},
  list:el=>{ui.list=el.dataset.v;ui.q='';ui.keep=false;render()},
  listback:()=>{ui.list=null;ui.keep=false;render()},
  catedit:el=>catSheet(el.dataset.id||null),
  note:el=>noteSheet(el.dataset.id), noteedit:()=>noteSheet(null),
  nfilter:el=>{ui.nf=el.dataset.v;render()},
};
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const f=A[el.dataset.act]; if(f){ if(el.closest('.row')&&Date.now()<noClickUntil&&el.dataset.act!=='close')return; f(el,e);} });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){const w=$$('.sheetwrap:not(.out)').pop();if(w)closeSheet(w)} });

/* search inputs */
document.addEventListener('input',e=>{
  if(e.target.id==='tsearch'){ui.q=e.target.value;$('#tresults').innerHTML=searchHtml(ui.q);$('#tmain').hidden=!!ui.q.trim()}
  else if(e.target.id==='nsearch'){ui.nq=e.target.value;$('#nlist').innerHTML=notesHtml()}
  else if(e.target.id==='qainput'){qaPreview()}
});
/* inline add (week) */
document.addEventListener('submit',e=>{
  const f=e.target; if(f.classList.contains('inl')&&f.dataset.day){ e.preventDefault(); const ds=f.dataset.day,i=$('input',f),txt=i.value.trim(); if(!txt)return;
    const p=parseQuick(txt,ds); if(!p.title)return; addTask({title:p.title,date:p.date||ds,time:p.time,pri:p.pri,cat:p.cat,rec:p.rec}); haptic(); ui.keepFocus=i.id; commit(); const n=document.getElementById(i.id); if(n){n.value='';n.focus({preventScroll:true})} }
});
/* quick add bar */
function qaPreview(){ const v=$('#qainput').value; const box=$('#qachips'); if(!v.trim()){box.innerHTML='';return}
  const b=qaBase(),p=parseQuick(v.trim(),b.date); const chips=p.chips.slice(); if(b.cat&&!p.cat)chips.push(catOf(b.cat).name);
  box.innerHTML=chips.map(c=>`<span class="chip">${esc(c)}</span>`).join(''); }
$('#qaform').addEventListener('submit',e=>{e.preventDefault();const i=$('#qainput'),v=i.value.trim();if(!v)return;const b=qaBase(),p=parseQuick(v,b.date);if(!p.title){toast('Добавьте название задачи');return}
  addTask({title:p.title,date:p.date,time:p.time,pri:p.pri,cat:p.cat||b.cat,rec:p.rec});haptic();i.value='';$('#qachips').innerHTML='';commit();
  toast(p.date?`Добавлено: ${relDay(p.date).toLowerCase()}${p.time?' в '+p.time:''}`:'Добавлено во входящие');i.focus({preventScroll:true})});
$('#qamore').addEventListener('click',()=>{const i=$('#qainput'),v=i.value.trim(),b=qaBase();const p=v?parseQuick(v,b.date):null;
  taskSheet(null,p?{title:p.title,date:p.date,time:p.time,pri:p.pri,cat:p.cat||b.cat,rec:p.rec}:{date:b.date,cat:b.cat});i.value='';$('#qachips').innerHTML=''});
$('#qamore').innerHTML=ic('edit',20); $('#qasub').innerHTML=ic('plus',22,2.4);

/* swipe / long press / drag */
let g=null, dr=null;
document.addEventListener('pointerdown',e=>{
  if(e.button>0) return;
  const grip=e.target.closest('[data-grip]'); if(grip){startDrag(e,grip);return}
  if(e.target.closest('button,input,textarea,select,a,label')) return;
  const row=e.target.closest('.swipe .row'); if(!row) return;
  g={row,sw:row.parentElement,x:e.clientX,y:e.clientY,dx:0,mode:null,id:e.pointerId};
  g.timer=setTimeout(()=>{if(g&&!g.mode){g.mode='long';suppress();haptic();openActions(row)}},500);
});
function openActions(row){ g=null; actionSheet(row.dataset.id,row.dataset.ds||null); }
document.addEventListener('pointermove',e=>{
  if(dr&&e.pointerId===dr.pid){moveDrag(e);return}
  if(!g||e.pointerId!==g.id) return;
  const dx=e.clientX-g.x, dy=e.clientY-g.y;
  if(!g.mode){
    if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){clearTimeout(g.timer);g=null;return}
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){g.mode='swipe';clearTimeout(g.timer);g.sw.classList.add('swiping');try{g.row.setPointerCapture(e.pointerId)}catch(_){}}
    else if(Math.abs(dx)>6||Math.abs(dy)>6) clearTimeout(g.timer);
  }
  if(g&&g.mode==='swipe'){g.dx=Math.max(-150,Math.min(150,dx));g.row.style.transform=`translateX(${g.dx}px)`;g.sw.dataset.dir=g.dx>0?'r':'l';g.sw.style.setProperty('--p',Math.min(1,Math.abs(g.dx)/80))}
});
function endSwipe(e,cancel){
  if(dr&&e.pointerId===dr.pid){endDrag(e,cancel);return}
  if(!g||e.pointerId!==g.id) return; clearTimeout(g.timer);
  const {row,sw,dx,mode}=g; g=null;
  if(mode==='swipe'){suppress();sw.classList.remove('swiping');row.style.transform='';delete sw.dataset.dir;
    if(!cancel){ if(dx>=80)toggleTask(row.dataset.id,row.dataset.ds||todayS()); else if(dx<=-80)postponeTask(row.dataset.id,row.dataset.ds||todayS()); } }
}
document.addEventListener('pointerup',e=>endSwipe(e,false));
document.addEventListener('pointercancel',e=>endSwipe(e,true));
function startDrag(e,grip){
  const sw=grip.closest('.swipe'); const grp=sw&&sw.dataset.group; if(!grp) return; e.preventDefault();
  dr={sw,grp,pid:e.pointerId,y0:e.clientY,sibs:$$('.swipe[data-group]').filter(x=>x.dataset.group===grp),over:null};
  sw.classList.add('dragging'); try{grip.setPointerCapture(e.pointerId)}catch(_){}
}
function moveDrag(e){
  const dy=e.clientY-dr.y0; dr.sw.style.transform=`translateY(${dy}px)`; dr.sw.style.transition='none';
  const r=dr.sw.getBoundingClientRect(), cy=r.top+r.height/2; dr.sibs.forEach(s=>s.classList.remove('dropbefore')); dr.over=null;
  for(const s of dr.sibs){ if(s===dr.sw) continue; const q=s.getBoundingClientRect(); if(cy<q.top+q.height/2){dr.over=s;s.classList.add('dropbefore');break} }
}
function endDrag(e,cancel){
  const d=dr; dr=null; d.sw.classList.remove('dragging'); d.sw.style.transform=''; d.sw.style.transition=''; d.sibs.forEach(s=>s.classList.remove('dropbefore'));
  if(cancel) return;
  const ids=d.sibs.filter(s=>s!==d.sw).map(s=>s.dataset.key.split('|')[0]), me=d.sw.dataset.key.split('|')[0];
  const at=d.over?ids.indexOf(d.over.dataset.key.split('|')[0]):ids.length; ids.splice(at,0,me);
  const base=ids.map(id=>taskById(id)).filter(Boolean); if(!base.length) return;
  const slots=base.map(t=>t.ord).sort((a,b)=>a-b); let changed=false;
  base.forEach((t,i)=>{const v=slots[i]+i*0; if(t.ord!==v){t.ord=v;changed=true}});
  if(!changed){ base.forEach((t,i)=>{t.ord=(i+1)*10}); }
  suppress(); commit();
}

/* ───────── boot ───────── */
function boot(){
  S=loadLocal(); if(S){S=migrate(S)} else { S=emptyState(); ui.first=true; }
  saveLocal();
  const h=(location.hash||'').replace('#',''); if(TABS.some(t=>t[0]===h)) ui.tab=h;
  if(ui.tab==='week') ui.scrollTo='day-'+todayS();
  $('#qainput').placeholder='Добавить задачу…';
  render();
  if(ui.first) welcomeSheet();
  try{ if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('./sw.js'); }catch(e){}
  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
  setInterval(()=>{checkReminders(); if(todayS()!==ui.lastDay){ui.lastDay=todayS();render()}},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders(); if(todayS()!==ui.lastDay){ui.lastDay=todayS();render()}}});
  window.addEventListener('hashchange',()=>{const h=(location.hash||'').replace('#','');if(TABS.some(t=>t[0]===h)&&h!==ui.tab)setTab(h)});
  setTimeout(checkReminders,1500);
}
boot();
})();
